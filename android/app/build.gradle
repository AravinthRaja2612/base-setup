plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.flutter_learn"

    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // ✅ FIX: Enable BuildConfig generation
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.flutter_learn"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

//    signingConfigs {
//        debug {
//            storeFile file("${rootDir}/debug.keystore")
//        }
//    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    flavorDimensions += "default"

    productFlavors {
        create("dev") {
            dimension = "default"
            resValue "string", "app_name", "AR Dev"
            buildConfigField "String", "FLAVOR_NAME", "\"dev\""
        }
        create("mock") {
            dimension = "default"
            resValue "string", "app_name", "AR Mock"
            buildConfigField "String", "FLAVOR_NAME", "\"mock\""
        }
        create("prod") {
            dimension = "default"
            resValue "string", "app_name", "AR"
            buildConfigField "String", "FLAVOR_NAME", "\"prod\""
        }
    }
}

flutter {
    source = "../.."
}
